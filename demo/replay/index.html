<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D trajectory replay · Embodied AI</title><link rel="icon" href="../favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#17283b;font:15px system-ui,sans-serif}header{height:90px;padding:16px 24px;background:#13263b;color:white}h1{margin:0 0 6px;font-size:23px;font-weight:650}header p{margin:0;color:#c2d1df;font-size:14px}.panels{display:flex;height:calc(100vh - 168px);min-height:350px;gap:2px;background:#acb9c6}.panel{position:relative;flex:1;min-width:0;background:#e8edf2}.view{width:100%;height:100%}.badge{position:absolute;top:16px;left:20px;right:20px;background:#fffffff0;border-radius:9px;padding:12px 15px;box-shadow:0 2px 12px #0e203a15;pointer-events:none}.badge b{font-size:19px}.badge .sub{font-size:12px;color:#556477;margin-top:3px}.metrics{position:absolute;bottom:14px;left:18px;right:18px;background:#fffffff0;padding:10px 13px;border-radius:8px;font-size:14px;pointer-events:none}.metrics strong{color:#03696e}.controls{height:78px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 22px;background:white}.controls input[type=range]{flex:1;min-width:140px;accent-color:#087f89}button{border:1px solid #cbd5df;background:white;color:#173149;border-radius:6px;padding:8px 16px;cursor:pointer}.legend{font-size:13px;color:#4a5b6a}#error{position:fixed;top:100px;background:#fff4ed;color:#a23b12;padding:12px;z-index:10}#error:empty{display:none}.controls label{font-size:13px}.single .panel{width:100%}@media(max-width:750px){header{height:108px;padding:12px}h1{font-size:19px}.panels{height:calc(100vh - 226px)}.controls{height:118px;padding:10px}.badge{top:8px;left:8px;right:8px;padding:8px}.badge b{font-size:14px}.metrics{font-size:12px;left:8px;right:8px}}
.recording .controls button,.recording .controls input,.recording .controls label{display:none}.recording #time{font-weight:650}.recording .legend{margin-left:auto}
#back{float:right;color:#fff;font-size:13px;margin-left:12px}header h1{padding-right:85px}.controls{height:auto;min-height:78px}.controls input[type=range]{min-width:100px}.legend{max-width:100%}@media(max-width:600px){header{height:130px}header h1{font-size:16px}.panels{height:calc(100dvh - 280px)}.controls{gap:8px;font-size:12px}.legend{font-size:11px}header p{font-size:12px}}
</style><script type="module" src="replay.js"></script></head>
<body><header><a id="back" href="../#trajectories">← Gallery</a><h1>Loading trajectory…</h1><p>Drag to orbit · Scroll to zoom · Use the timeline to inspect recorded motion</p></header>
<div class="panels" id="panels"></div><div id="error"></div>
<footer class="controls"><button id="play">Play</button><input id="seek" aria-label="Replay time" type="range" min="0" max="1" value="0" step="0.01"><span id="time">0.00 s</span><label><input id="hulls" type="checkbox"> Collision shapes</label><label><input id="points" type="checkbox" checked> Keypoints</label><span class="legend">Green: target pose · Cyan: target path · Orange: tool keypoints · Drag to orbit</span></footer>
</body></html>
